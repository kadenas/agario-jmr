<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1a1f2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>AgarJMR</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu" class="overlay">
    <div class="card">
      <h1>Agar.io <span class="badge">JMR</span></h1>
      <p class="hint">Mueve con el ratón · Espacio = dividir · W = expulsar masa</p>

      <label class="field">
        <span>Nombre</span>
        <input id="name" maxlength="16" placeholder="Tu nombre" />
      </label>

      <div class="field">
        <span>Color / Skin</span>
        <div id="skins" class="skins"></div>
      </div>

      <div class="field">
        <span>Modo de juego</span>
        <div class="modes">
          <button class="mode active" data-mode="ffa">FFA (Todos vs Todos)</button>
          <button class="mode" data-mode="teams">Equipos (Rojo vs Azul)</button>
        </div>
      </div>

      <button id="play" class="play">Jugar</button>
    </div>
  </div>

  <div id="dead" class="overlay hidden">
    <div class="card">
      <h2>Te comieron 💀</h2>
      <p id="finalMass"></p>
      <button id="respawn" class="play">Volver a jugar</button>
    </div>
  </div>

  <canvas id="game"></canvas>

  <div id="touchControls" class="hidden">
    <button id="btnEject" class="touchBtn" aria-label="Expulsar masa">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5"/>
        <path d="M5 12l7-7 7 7"/>
      </svg>
      <span>W</span>
    </button>
    <button id="btnSplit" class="touchBtn primary" aria-label="Dividir">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7" cy="12" r="4"/>
        <circle cx="17" cy="12" r="4"/>
      </svg>
      <span>Split</span>
    </button>
  </div>

  <div id="hud" class="hidden">
    <div id="stats">
      <span id="mass">Masa: 0</span>
      <span id="players">Jugadores: 0</span>
    </div>
    <div id="leaderboard">
      <h3>Top</h3>
      <ol id="board"></ol>
      <div id="teamScores" class="hidden">
        <div class="team red"><span>Rojo</span><b id="redScore">0</b></div>
        <div class="team blue"><span>Azul</span><b id="blueScore">0</b></div>
      </div>
    </div>
  </div>

  <script src="client.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
